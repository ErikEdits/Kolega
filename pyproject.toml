[project]
name = "corecontrol"
dynamic = ["version"]
description = "CoreControl – Windows-PC-Control-Center mit verständlicher Systemdiagnose"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: Tests, die echte Windows-Schnittstellen benötigen (laufen nur unter Windows)",
    "gui: Tests, die die Qt-Oberfläche starten",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# Nur Fehlerklassen, die echte Abstürze/Fehlverhalten verursachen (z. B. eine Variable,
# die ein importiertes Modul verdeckt), keine reinen Stilregeln.
select = ["F", "E9", "B006", "B008", "B023", "PLE"]
