name: Test und Windows-Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-tests:
    name: Tests (Linux, plattformunabhängige Logik)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgl1
      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs

  windows:
    name: Tests + EXE (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt
      - name: Tests (inkl. echter Windows-Schnittstellen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs
      - name: Selbsttest der Windows-Schnittstellen
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/windows_selftest.py
      - name: EXE bauen
        run: python tools/build_exe.py
      - name: EXE-Starttest (Oberfläche wird geladen und alle Seiten aufgerufen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          CC_SHOT_WAIT: "1500"
        run: |
          $env:CORECONTROL_HOME = "$PWD\cc_home"
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $p = Start-Process -FilePath "dist\CoreControl.exe" -ArgumentList "--screenshot","$PWD\shots" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "EXE hat sich nicht rechtzeitig beendet" }
          $shots = Get-ChildItem shots -Filter *.png
          $shots | ForEach-Object { "{0}  {1:N0} Bytes" -f $_.Name, $_.Length }
          if ($shots.Count -lt 15) { throw "Zu wenige Seiten geladen: $($shots.Count)" }
          Get-Content "$env:CORECONTROL_HOME\logs\corecontrol.log" -ErrorAction SilentlyContinue | Select-Object -Last 60
          if (Select-String -Path "$env:CORECONTROL_HOME\logs\corecontrol.log" -Pattern "corecontrol.errors" -Quiet) { throw "Fehler im Protokoll der EXE" }
      - name: EXE-Größe
        shell: pwsh
        run: Get-Item dist\CoreControl.exe | ForEach-Object { "{0:N1} MB" -f ($_.Length / 1MB) }
      - name: EXE hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CoreControl-Windows
          path: dist/CoreControl.exe
          retention-days: 30
      - name: Seitenbilder hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Seitenbilder-Windows
          path: shots/
          retention-days: 14
      - name: Release erstellen (nur bei Versions-Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist\CoreControl.exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Out-File -Encoding utf8 dist\CoreControl.exe.sha256.txt
          gh release create "${{ github.ref_name }}" dist\CoreControl.exe dist\CoreControl.exe.sha256.txt --title "CoreControl ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md
